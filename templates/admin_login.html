{% extends "base.html" %}
{% block title %}Admin Login – CancerScreen AI{% endblock %}
{% block content %}
<div style="max-width:420px;margin:80px auto;padding:0 24px">
  <div class="card" style="padding:32px">
    <div style="text-align:center;margin-bottom:28px">
      <div class="brand-icon" style="margin:0 auto 12px;width:52px;height:52px;font-size:22px"><i class="fas fa-lock"></i></div>
      <h2 style="font-size:22px;font-weight:800">Admin Login</h2>
      <p style="color:var(--text-2);font-size:14px;margin-top:6px">CancerScreen AI Admin Dashboard</p>
    </div>
    <form method="POST" action="{{ url_for('admin') }}">
      <div class="form-group" style="margin-bottom:20px">
        <label style="font-size:14px;font-weight:600;margin-bottom:6px;display:block">Admin Password</label>
        <div class="inp-wrap">
          <i class="fas fa-lock inp-ico"></i>
          <input class="inp" type="password" name="password" placeholder="Enter admin password" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="padding:12px">
        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
      </button>
    </form>
  </div>
</div>
{% endblock %}
